  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1e1e24;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #fff;
      padding: 20px;
    }
    .card-wrap {
      max-width: 500px;
      width: 100%;
      box-shadow: 0 25px 60px rgba(0,0,0,0.6);
      border-radius: 24px;
      overflow: hidden;
      background: #000;
    }
    .card-wrap svg {
      width: 100%;
      height: auto;
      display: block;
    }
    .actions {
      margin-top: 20px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button, a.btn {
      padding: 12px 24px;
      border-radius: 99px;
      border: none;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }
    .btn-download {
      background: linear-gradient(135deg, #d4af37, #aa771c);
      color: #2c1810;
    }
    .btn-download:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(212,175,55,0.4);
    }
    .btn-view {
      background: rgba(255,255,255,0.12);
      color: #fff;
    }
    .btn-view:hover {
      background: rgba(255,255,255,0.2);
    }
  </style>
